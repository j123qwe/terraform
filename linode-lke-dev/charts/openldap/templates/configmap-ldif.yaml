apiVersion: v1
kind: ConfigMap
metadata:
  name: openldap-ldif
data:
  # Applied in filename order, first start only (empty data volume): data first, then the ACL.
  # Passwords are set by the post-install Job so the directory stores hashes, never the cleartext.
  # 03-memberOf.ldif replaces the image's file of the same name, which is wired for groupOfUniqueNames.
  03-memberOf.ldif: |
    dn: cn=module{0},cn=config
    changetype: modify
    add: olcModuleLoad
    olcModuleLoad: memberof

    dn: olcOverlay={0}memberof,olcDatabase={1}mdb,cn=config
    changetype: add
    objectClass: olcOverlayConfig
    objectClass: olcMemberOf
    olcOverlay: {0}memberof
    olcMemberOfDangling: ignore
    olcMemberOfRefInt: TRUE
    olcMemberOfGroupOC: groupOfNames
    olcMemberOfMemberAD: member
    olcMemberOfMemberOfAD: memberOf
  01-directory.ldif: |
    dn: ou=people,{{ .Values.baseDn }}
    objectClass: organizationalUnit
    ou: people

    dn: ou=groups,{{ .Values.baseDn }}
    objectClass: organizationalUnit
    ou: groups

    dn: ou=services,{{ .Values.baseDn }}
    objectClass: organizationalUnit
    ou: services

    dn: {{ .Values.bindDn }}
    objectClass: inetOrgPerson
    cn: svc-bind
    sn: svc-bind
    description: Read-only service account
    {{- range .Values.users }}

    dn: uid={{ .uid }},ou=people,{{ $.Values.baseDn }}
    objectClass: inetOrgPerson
    objectClass: posixAccount
    uid: {{ .uid }}
    cn: {{ .cn }}
    givenName: {{ .givenName }}
    sn: {{ .sn }}
    mail: {{ .mail }}
    uidNumber: {{ .uidNumber }}
    gidNumber: {{ .gidNumber }}
    homeDirectory: /home/{{ .uid }}
    loginShell: /bin/bash
    {{- end }}
    {{- range .Values.groups }}

    dn: cn={{ .name }},ou=groups,{{ $.Values.baseDn }}
    objectClass: groupOfNames
    cn: {{ .name }}
    {{- range .members }}
    member: uid={{ . }},ou=people,{{ $.Values.baseDn }}
    {{- end }}
    {{- end }}
  02-acl.ldif: |
    # No anonymous reads; authenticated users and the service account can read, admin manages.
    # Keeps the image's root (peercred) rule first so later EXTERNAL operations still work.
    dn: olcDatabase={1}mdb,cn=config
    changetype: modify
    replace: olcAccess
    olcAccess: {0}to * by dn.exact=gidNumber=0+uidNumber=0,cn=peercred,cn=external,cn=auth manage by * break
    olcAccess: {1}to attrs=userPassword,shadowLastChange by self write by anonymous auth by * none
    olcAccess: {2}to * by dn.exact="{{ .Values.adminDn }}" manage by dn.exact="{{ .Values.bindDn }}" read by users read by * none
