apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openldap
spec:
  secretName: openldap-tls
  dnsNames:
    - {{ .Values.host | quote }}
  usages:
    - digital signature
    - key encipherment
    - server auth
  issuerRef:
    kind: ClusterIssuer
    name: {{ .Values.certIssuer }}
