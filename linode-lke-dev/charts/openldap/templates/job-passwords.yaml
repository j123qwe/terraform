apiVersion: batch/v1
kind: Job
metadata:
  name: openldap-set-passwords
  annotations:
    # Only on first install: later runs would overwrite passwords changed in the GUI
    "helm.sh/hook": post-install
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 1200
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: set-passwords
          image: {{ .Values.image }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              URI=ldap://openldap:389
              {{- if .Values.tlsEnforce }}
              # In-cluster name is not in the certificate, so STARTTLS without verification
              export LDAPTLS_REQCERT=never
              STARTTLS=-ZZ
              {{- else }}
              STARTTLS=
              {{- end }}
              set_pw() {
                until ldappasswd -x $STARTTLS -H "$URI" -D {{ .Values.adminDn | quote }} -w "$ADMIN_PW" -T "/secrets/$2" "$1"; do
                  echo "waiting for $1"; sleep 5
                done
              }
              {{- range .Values.passwordEntries }}
              set_pw {{ .dn | quote }} {{ .secretKey | quote }}
              {{- end }}
          env:
            - name: ADMIN_PW
              valueFrom: { secretKeyRef: { name: {{ .Values.adminSecret }}, key: admin-password } }
          volumeMounts:
            - { name: passwords, mountPath: /secrets, readOnly: true }
      volumes:
        - name: passwords
          secret:
            secretName: {{ .Values.passwordsSecret }}
            defaultMode: 0400
