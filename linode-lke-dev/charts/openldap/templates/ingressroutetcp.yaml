# Plain LDAP (STARTTLS-capable); no SNI available, so match everything on the entrypoint
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: openldap
spec:
  entryPoints: [ldap]
  routes:
    - match: HostSNI(`*`)
      services:
        - { name: openldap, port: 389 }
---
# LDAPS: TLS passthrough so slapd presents its own certificate (clients must connect by hostname for SNI)
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: openldaps
spec:
  entryPoints: [ldaps]
  routes:
    - match: HostSNI(`{{ .Values.host }}`)
      services:
        - { name: openldap, port: 636 }
  tls:
    passthrough: true
